<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Survival Battle</title>
    <script>
        (function() {
            const SUPPRESSED = ['message channel closed', 'listener indicated', 'asynchronous response'];
            window.onerror = function(msg) {
                const s = typeof msg === 'string' ? msg : (msg.message || String(msg));
                if (SUPPRESSED.some(k => s.toLowerCase().includes(k))) return true;
            };
            window.addEventListener('unhandledrejection', e => {
                const msg = e.reason ? (e.reason.message || String(e.reason)) : '';
                if (SUPPRESSED.some(k => msg.toLowerCase().includes(k))) { e.preventDefault(); e.stopImmediatePropagation(); }
            }, true);
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #09090b; color: #eee; font-size: 10px;
        }
        .app-container {
            display: grid;
            grid-template-columns: 160px 1fr 180px;
            grid-template-rows: 32px 1fr;
            height: 100vh; gap: 4px; padding: 4px;
        }
        header {
            grid-column: 1 / -1; background: #16161a; border-radius: 4px;
            display: flex; align-items: center; padding: 0 10px; gap: 8px; border: 1px solid #333;
        }
        h1 { font-size: 0.8rem; color: #00ffcc; white-space: nowrap; }
        .hud-item { padding: 2px 6px; border-radius: 10px; background: #222; border: 1px solid #444; font-weight: bold; font-size: 0.6rem; }
        
        .sidebar, .analysis-bar { background: #16161a; border-radius: 4px; padding: 5px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #333; overflow: hidden; }
        .main-content { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); 
            gap: 4px; height: 100%; min-height: 0;
        }

        .team-card { 
            background: #1c1c21; border: 1px solid #333; border-radius: 4px; padding: 4px; 
            display: flex; flex-direction: column; justify-content: space-between; min-height: 0;
            position: relative;
        }
        .team-card.is-player { border-color: #00ffcc; background: #111a19; }
        .team-card.highlight { animation: flash 0.6s; }
        @keyframes flash { 50% { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; } }

        .team-name { font-size: 0.6rem; font-weight: bold; color: #555; }
        .is-player .team-name { color: #00ffcc; }

        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; flex-grow: 1; }
        .matrix-grid input {
            width: 100%; height: 100%; text-align: center; background: #000; color: #fff;
            border: 1px solid #333; border-radius: 1px; font-size: 0.85rem; padding: 0; font-weight: bold;
        }
        .matrix-grid input.cell-used { border-color: #ff8c00 !important; background: rgba(255,140,0,0.15) !important; color: #ff8c00; }
        .matrix-grid input.selection-target { border-color: #00ffcc !important; background: rgba(0,255,204,0.3) !important; cursor: pointer; }
        
        .det-box {
            margin-top: 2px; padding: 2px 4px; background: rgba(0,0,0,0.4); border-radius: 2px;
            display: flex; justify-content: space-between; font-size: 0.6rem; font-family: monospace;
        }
        .det-val.zero { color: #ff4444; font-weight: bold; }
        .ax-val { color: #00ffcc; }

        .btn { width: 100%; padding: 5px; border-radius: 3px; border: none; cursor: pointer; font-weight: bold; font-size: 0.65rem; transition: 0.1s; }
        .btn-start { background: #28a745; color: white; }
        .btn-confirm { background: #6f42c1; color: white; }
        .btn-page { background: #222; border: 1px solid #444; color: #0cf; margin-top: auto; text-decoration: none; text-align: center; }

        .log-area { flex-grow: 1; background: #000; border-radius: 3px; padding: 4px; font-size: 0.6rem; overflow-y: auto; font-family: monospace; border: 1px solid #222; line-height: 1.2; }
        .log-ai { color: #ff6b6b; } .log-player { color: #00ffcc; } .log-sys { color: #ffd700; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal { background: #1a1a1d; border: 2px solid #007bff; padding: 12px; border-radius: 10px; width: 280px; }
        .priv-btn { margin-bottom: 5px; text-align: left; padding: 8px; font-size: 0.75rem; background: #333; color: #fff; border: 1px solid #444; }
        
        .cell-wrapper { position: relative; width: 100%; height: 100%; }
        .diag-mask { position: absolute; inset: 0; background: #111; border: 1px solid #222; display: none; align-items: center; justify-content: center; color: #444; font-size: 1.2rem; pointer-events: none; z-index: 5; }
        .diag-mask.active { display: flex; }

        /* Focus overlay - cells */
        .focus-cell-grid { display:grid; grid-template-columns:repeat(3,76px); grid-template-rows:repeat(3,76px); gap:4px; }
        .focus-cell { background:#1c1c21; border:2px solid #3a3a44; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:#eee; cursor:pointer; transition:all 0.12s; user-select:none; }
        .focus-cell.clickable:hover { border-color:#00ffcc; background:#0d2420; }
        .focus-cell.sel1 { border-color:#ffd700 !important; background:#2a2000 !important; color:#ffd700; }
        .focus-cell.row-hi { border-color:#ffd700; background:rgba(255,215,0,0.08); color:#ffd700; }
        .focus-cell.col-hi { border-color:#00ffcc; background:rgba(0,255,204,0.08); color:#00ffcc; }
        /* Focus overlay - row/col labels */
        .row-label { width:30px; height:76px; background:#1a1a20; border:2px solid #333; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; font-weight:bold; color:#555; cursor:pointer; transition:all 0.12s; user-select:none; writing-mode:horizontal-tb; }
        .row-label:hover, .row-label.hover { border-color:#ffd700; color:#ffd700; background:rgba(255,215,0,0.08); }
        .row-label.sel { border-color:#ffd700 !important; background:rgba(255,215,0,0.2) !important; color:#ffd700 !important; }
        .col-label { width:76px; height:30px; background:#1a1a20; border:2px solid #333; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; font-weight:bold; color:#555; cursor:pointer; transition:all 0.12s; user-select:none; }
        .col-label:hover, .col-label.hover { border-color:#00ffcc; color:#00ffcc; background:rgba(0,255,204,0.08); }
        .col-label.sel { border-color:#00ffcc !important; background:rgba(0,255,204,0.2) !important; color:#00ffcc !important; }
        /* Privilege pick buttons */
        .priv-pick-btn { background:#1c1c21; border:2px solid #333; border-radius:8px; padding:14px 8px; cursor:pointer; text-align:center; font-size:0.9rem; font-weight:bold; color:#aaa; transition:all 0.15s; }
        .priv-pick-btn:hover { border-color:#00ffcc; color:#00ffcc; background:#0d1a18; }
    </style>
</head>
<body>

<div class="overlay" id="privilege-ui" style="flex-direction:column;">
    <div style="background:#1a1a1d; border:2px solid #444; border-radius:14px; padding:28px; width:min(90vw,520px);">
        <h2 style="color:#ffd700; font-size:1.3rem; text-align:center; margin-bottom:20px;">🏆 라운드 승리 — 특권 선택</h2>
        <div id="priv-pick-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
            <div class="priv-pick-btn" onclick="selectPriv('swap_row', this)">🔁<br><span style="font-size:0.75rem; font-weight:normal; color:#777; display:block; margin-top:4px;">행 교환</span></div>
            <div class="priv-pick-btn" onclick="selectPriv('swap_col', this)">🔃<br><span style="font-size:0.75rem; font-weight:normal; color:#777; display:block; margin-top:4px;">열 교환</span></div>
            <div class="priv-pick-btn" onclick="selectPriv('zero', this)">⓪<br><span style="font-size:0.75rem; font-weight:normal; color:#777; display:block; margin-top:4px;">원소 0화</span></div>
            <div class="priv-pick-btn" onclick="selectPriv('swap_elements', this)">↔<br><span style="font-size:0.75rem; font-weight:normal; color:#777; display:block; margin-top:4px;">위치 교환</span></div>
        </div>
        <div id="priv-scope-selector" style="display:none; border-top:1px solid #333; padding-top:18px; text-align:center;">
            <p id="priv-scope-label" style="color:#aaa; font-size:0.85rem; margin-bottom:14px;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn" style="padding:12px 24px; font-size:0.9rem; background:#0a3a2a; border:2px solid #00ffcc; color:#00ffcc;" onclick="applyPriv('self')">내 팀에 적용</button>
                <button class="btn" style="padding:12px 24px; font-size:0.9rem; background:#3a0a10; border:2px solid #ff4444; color:#ff4444;" onclick="applyPriv('others')">전 타팀에 적용</button>
            </div>
        </div>
    </div>
</div>

<div class="overlay" id="priv-focus-overlay" style="flex-direction:column; background:rgba(0,0,0,0.96); z-index:2000;">
    <div style="background:#16161c; border:2px solid #00ffcc; border-radius:14px; padding:24px; text-align:center;">
        <h2 id="focus-title" style="color:#00ffcc; font-size:1.2rem; margin-bottom:6px;"></h2>
        <p id="focus-hint" style="color:#888; font-size:0.8rem; margin-bottom:18px; min-height:1.1em;"></p>
        <div id="focus-body" style="display:flex; flex-direction:column; align-items:center; gap:4px;"></div>
        <button class="btn" style="background:#2a2a30; border:1px solid #444; margin-top:18px; width:auto; padding:8px 32px; color:#888;" onclick="exitFocus()">취소</button>
    </div>
</div>

<div class="app-container">
    <header>
        <h1>MATRIX SURVIVAL</h1>
        <div id="hud-round" class="hud-item">R1</div>
        <div id="hud-x" class="hud-item" style="color:#ffd700">X=[0,0,0]</div>
        <div id="hud-actions" class="hud-item" style="color:#00ffcc">남은: 1</div>
        <div id="turn-status" style="margin-left:auto; font-weight:bold; font-size:0.65rem;"></div>
    </header>

    <div class="sidebar">
        <button class="btn btn-start" onclick="startBattle()">🎮 게임 시작</button>
        <button class="btn btn-confirm" id="btn-confirm" onclick="confirmMove()" disabled>✅ 내 수 확정</button>
        <button class="btn" style="background:#333; color:#888;" onclick="clearAllInputs()">🧹 초기화</button>
        <button class="btn" id="btn-reveal" style="background:#222; color:#555;" onclick="toggleDiag()">🔓 대각 공개</button>
        <div class="log-area" id="log">대전 대기 중...</div>
        <button class="btn" style="background:#1a2a1a; border:1px solid #00aa88; color:#00ffcc;" onclick="window.open('advice.html','_blank')">📊 전략 조언 열기 ↗</button>
        <button class="btn" style="background:#2a1a00; border:1px solid #ff6b6b; color:#ff9966; margin-top: auto;" onclick="window.open('battle.html','_blank')">⚔ AI 배틀 보기 ↗</button>
    </div>

    <div class="main-content" id="matrix-container"></div>
    <div class="analysis-bar" id="ranking-content"></div>
</div>

<script>
    const state = { active: false, playerTurn: false, round: 1, actions: 1, used: new Set(), privMode: null, privScope: null, privTarget: null, privSelections: [] };
    const DIAG = [0, 4, 8];
    let mlpWeights = null;

    function calculateDet(m) { return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]); }
    function calculateX(mats) { let x=[0,0,0]; for(let i=0; i<3; i++) x[i]=Math.floor(mats.reduce((s,m)=>s+m[i*4],0)/6); return x; }
    function axSum(m, x) { return m[0]*x[0]+m[1]*x[1]+m[2]*x[2]+m[3]*x[0]+m[4]*x[1]+m[5]*x[2]+m[6]*x[0]+m[7]*x[1]+m[8]*x[2]; }

    function getMatrices() {
        let all = [];
        for(let t=0; t<6; t++) {
            let m = []; for(let i=0; i<9; i++) m.push(parseInt(document.getElementById(`t${t}-c${i}`).value) || 0);
            all.push(m);
        }
        return all;
    }

    function updateHUD() {
        const mats = getMatrices(), x = calculateX(mats);
        document.getElementById('hud-round').textContent = `R${state.round}`;
        document.getElementById('hud-actions').textContent = `남은: ${state.actions}`;
        document.getElementById('hud-x').textContent = `X=[${x.join(',')}]`;
        mats.forEach((m, t) => {
            const d = calculateDet(m), ax = axSum(m, x);
            document.getElementById(`det-${t}`).innerHTML = `<span>det: <b class="det-val ${d===0?'zero':''}">${d}</b></span><span>Ax: <b class="ax-val">${ax.toFixed(1)}</b></span>`;
        });
        const ranking = mats.map((m,i)=>({i, s: state.round<=2?axSum(m,x):calculateDet(m)})).sort((a,b)=>b.s-a.s);
        let h = `<div style="font-size:0.6rem; color:#444; margin-bottom:4px;">RANKING</div>`;
        ranking.forEach((r, rank) => { h += `<div style="display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #222; ${r.i===0?'color:#0cf; font-weight:bold;':''}"><span>${rank+1}위 T${r.i+1}</span><span>${r.s.toFixed(1)}</span></div>`; });
        document.getElementById('ranking-content').innerHTML = h;

        // 행동 잠금 강화
        if(state.playerTurn && state.actions === 0) {
            for(let i=0; i<9; i++) document.getElementById(`t0-c${i}`).disabled = true;
        }
    }

    function startBattle() {
        state.active = true; state.round = 1; document.getElementById('btn-confirm').disabled = false;
        document.getElementById('log').innerHTML = '';
        for(let t=0; t<6; t++) {
            for(let i=0; i<9; i++) {
                const inp = document.getElementById(`t${t}-c${i}`);
                inp.value = 0; inp.disabled = (t > 0); inp.classList.remove('cell-used');
            }
        }
        beginTurn(); addLog('sys', '배틀 시작!');
    }

    function beginTurn() {
        state.playerTurn = true; state.actions = state.round; state.used.clear();
        for(let i=0; i<9; i++) {
            const inp = document.getElementById(`t0-c${i}`);
            inp.disabled = false; inp.classList.remove('cell-used');
        }
        updateHUD();
        document.getElementById('turn-status').innerHTML = '<span style="color:#00ffcc">PLAYER</span>';
    }

    async function confirmMove() {
        if(state.actions > 0) return alert('행동을 다 쓰세요.');
        state.playerTurn = false;
        document.getElementById('turn-status').innerHTML = '<span style="color:#ff6b6b">AI TURN</span>';
        addLog('player', `R${state.round} 수 확정.`);
        let processed = 0;
        for(let t=1; t<=5; t++) {
            setTimeout(() => {
                let mats = getMatrices();
                let myM = [...mats[t]];
                const usedIdx = new Set();
                const temp = AI_TEMPS[t];
                for(let a=0; a<state.round; a++) {
                    mats[t] = [...myM];
                    const x = calculateX(mats);
                    const {cellIdx, delta} = aiPickAction(t, mats, x, state.round, usedIdx, temp);
                    myM[cellIdx] += delta;
                    usedIdx.add(cellIdx);
                }
                const card = document.querySelector(`.team-card[data-team="${t}"]`);
                card.classList.add('highlight'); setTimeout(()=>card.classList.remove('highlight'), 500);
                for(let i=0; i<9; i++) document.getElementById(`t${t}-c${i}`).value = myM[i];
                updateHUD();
                if(++processed === 5) checkRoundEnd();
            }, t * 150);
        }
    }

    function checkRoundEnd() {
        const mats = getMatrices(), x = calculateX(mats);
        const scores = mats.map(m => state.round <= 2 ? axSum(m, x) : calculateDet(m));
        const sorted = scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
        let winIdx = (sorted[0].s > sorted[1].s) ? sorted[0].i : -1;
        if(winIdx === -1) {
            const p2 = sorted.filter(v=>v.s < sorted[0].s);
            if(p2.length > 0 && (p2.length === 1 || p2[0].s > p2[1].s)) winIdx = p2[0].i;
        }
        if(winIdx !== -1) {
            addLog('sys', `라운드 승자: T${winIdx+1}`);
            if(winIdx === 0) document.getElementById('privilege-ui').style.display='flex';
            else { addLog('ai', 'AI 특권 발동.'); setTimeout(nextRound, 1000); }
        } else { addLog('sys', '공동 승자.'); nextRound(); }
    }

    // ── Privilege Logic ──────────────────────────────────────────
    const PRIV_TITLES = { swap_row:'행 교환', swap_col:'열 교환', zero:'원소 0화', swap_elements:'위치 교환' };

    function selectPriv(mode, el) {
        state.privMode = mode;
        document.querySelectorAll('.priv-pick-btn').forEach(b => b.style.borderColor = '#333');
        if (el) el.style.borderColor = '#ffd700';
        document.getElementById('priv-scope-label').textContent =
            `「${PRIV_TITLES[mode]}」 — 적용 범위를 선택하세요`;
        document.getElementById('priv-scope-selector').style.display = 'block';
    }

    function applyPriv(scope) {
        document.getElementById('priv-scope-selector').style.display = 'none';
        document.getElementById('privilege-ui').style.display = 'none';
        document.querySelectorAll('.priv-pick-btn').forEach(b => b.style.borderColor = '#333');
        state.privScope = scope;
        // 항상 내 팀(0) 행렬을 기준으로 위치 선택
        enterFocus(0, state.privMode);
    }

    function enterFocus(tIdx, mode) {
        state.privTarget = 0;
        state.privSelections = [];
        const m = getMatrices()[0]; // 항상 내 팀 행렬로 위치 선택
        const scopeLabel = state.privScope === 'others' ? '전 타팀 일괄' : '내 팀';
        const hints = {
            swap_row:  '교환할 행을 두 개 클릭하세요.',
            swap_col:  '교환할 열을 두 개 클릭하세요.',
            zero:      '0으로 만들 원소 위치를 클릭하세요.',
            swap_elements: '교환할 첫 번째 원소 위치를 클릭하세요.'
        };
        document.getElementById('focus-title').textContent = `${PRIV_TITLES[mode]} — ${scopeLabel} — 위치 선택`;
        document.getElementById('focus-hint').textContent  = hints[mode];

        const body = document.getElementById('focus-body');
        body.innerHTML = '';

        if (mode === 'swap_row') {
            // Row label strip + cell grid side by side
            const wrap = document.createElement('div');
            wrap.style.cssText = 'display:flex; gap:4px;';
            const rowCols = document.createElement('div');
            rowCols.style.cssText = 'display:flex; flex-direction:column; gap:4px;';
            for (let r = 0; r < 3; r++) {
                const lbl = document.createElement('div');
                lbl.className = 'row-label'; lbl.id = `rl-${r}`; lbl.textContent = `R${r+1}`;
                lbl.onmouseover = () => highlightRow(r, true);
                lbl.onmouseout  = () => highlightRow(r, false);
                lbl.onclick = () => pickRow(r);
                rowCols.appendChild(lbl);
            }
            wrap.appendChild(rowCols);
            wrap.appendChild(buildCellGrid(m, false));
            body.appendChild(wrap);
        } else if (mode === 'swap_col') {
            // Col label strip on top + cell grid below
            const colRow = document.createElement('div');
            colRow.style.cssText = 'display:flex; gap:4px; margin-bottom:4px; margin-left:0;';
            for (let c = 0; c < 3; c++) {
                const lbl = document.createElement('div');
                lbl.className = 'col-label'; lbl.id = `cl-${c}`; lbl.textContent = `C${c+1}`;
                lbl.onmouseover = () => highlightCol(c, true);
                lbl.onmouseout  = () => highlightCol(c, false);
                lbl.onclick = () => pickCol(c);
                colRow.appendChild(lbl);
            }
            body.appendChild(colRow);
            body.appendChild(buildCellGrid(m, false));
        } else {
            body.appendChild(buildCellGrid(m, true));
        }

        document.getElementById('priv-focus-overlay').style.display = 'flex';
    }

    function buildCellGrid(m, clickable) {
        const grid = document.createElement('div');
        grid.className = 'focus-cell-grid'; grid.id = 'focus-cells';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'focus-cell' + (clickable ? ' clickable' : '');
            cell.textContent = m[i]; cell.dataset.idx = i;
            if (clickable) cell.onclick = () => handleFocusCell(i);
            grid.appendChild(cell);
        }
        return grid;
    }

    function getFocusCells() { return document.querySelectorAll('#focus-cells .focus-cell'); }

    function highlightRow(r, on) {
        getFocusCells().forEach((c, i) => {
            if (Math.floor(i/3) === r) c.classList.toggle('row-hi', on);
        });
        const lbl = document.getElementById(`rl-${r}`);
        if (lbl) lbl.classList.toggle('hover', on);
    }
    function highlightCol(c, on) {
        getFocusCells().forEach((cell, i) => {
            if (i%3 === c) cell.classList.toggle('col-hi', on);
        });
        const lbl = document.getElementById(`cl-${c}`);
        if (lbl) lbl.classList.toggle('hover', on);
    }

    function pickRow(r) {
        state.privSelections.push(r);
        document.getElementById(`rl-${r}`).classList.add('sel');
        getFocusCells().forEach((c, i) => { if(Math.floor(i/3)===r) c.classList.add('sel1'); });
        if (state.privSelections.length === 1) {
            document.getElementById('focus-hint').textContent = '교환할 두 번째 행을 클릭하세요.';
        } else {
            const [a, b] = state.privSelections;
            if (a === b) { resetRowSel(); return; }
            commitFocusAction([a, b]);
        }
    }

    function pickCol(c) {
        state.privSelections.push(c);
        document.getElementById(`cl-${c}`).classList.add('sel');
        getFocusCells().forEach((cell, i) => { if(i%3===c) cell.classList.add('sel1'); });
        if (state.privSelections.length === 1) {
            document.getElementById('focus-hint').textContent = '교환할 두 번째 열을 클릭하세요.';
        } else {
            const [a, b] = state.privSelections;
            if (a === b) { resetColSel(); return; }
            commitFocusAction([a, b]);
        }
    }

    function resetRowSel() {
        state.privSelections = [];
        document.querySelectorAll('.row-label').forEach(l => l.classList.remove('sel'));
        getFocusCells().forEach(c => c.classList.remove('sel1'));
        document.getElementById('focus-hint').textContent = '교환할 행을 두 개 클릭하세요.';
    }
    function resetColSel() {
        state.privSelections = [];
        document.querySelectorAll('.col-label').forEach(l => l.classList.remove('sel'));
        getFocusCells().forEach(c => c.classList.remove('sel1'));
        document.getElementById('focus-hint').textContent = '교환할 열을 두 개 클릭하세요.';
    }

    function handleFocusCell(idx) {
        if (state.privMode === 'zero') {
            commitFocusAction([idx]);
        } else if (state.privMode === 'swap_elements') {
            state.privSelections.push(idx);
            getFocusCells()[idx].classList.add('sel1');
            if (state.privSelections.length === 2) {
                const [a, b] = state.privSelections;
                commitFocusAction([a, b]);
            } else {
                document.getElementById('focus-hint').textContent = '교환할 두 번째 원소 위치를 클릭하세요.';
            }
        }
    }

    function applyActionToMatrix(m, mode, params) {
        if (mode === 'swap_row') {
            const [a, b] = params;
            for (let c=0;c<3;c++){let t=m[a*3+c];m[a*3+c]=m[b*3+c];m[b*3+c]=t;}
        } else if (mode === 'swap_col') {
            const [a, b] = params;
            for (let r=0;r<3;r++){let t=m[r*3+a];m[r*3+a]=m[r*3+b];m[r*3+b]=t;}
        } else if (mode === 'zero') {
            m[params[0]] = 0;
        } else if (mode === 'swap_elements') {
            const [a, b] = params;
            let tmp=m[a]; m[a]=m[b]; m[b]=tmp;
        }
    }

    function commitFocusAction(params) {
        const mats = getMatrices();
        const targets = state.privScope === 'others' ? [1,2,3,4,5] : [0];
        targets.forEach(tIdx => {
            const m = [...mats[tIdx]];
            applyActionToMatrix(m, state.privMode, params);
            for (let i=0;i<9;i++) document.getElementById(`t${tIdx}-c${i}`).value = m[i];
        });
        updateHUD();
        document.getElementById('priv-focus-overlay').style.display = 'none';
        state.privSelections = [];
        const mode = state.privMode;
        state.privMode = null; state.privScope = null; state.privTarget = null;
        addLog('sys', `특권(${PRIV_TITLES[mode]}) 완료.`);
        setTimeout(nextRound, 400);
    }

    function applyPrivToTeamAuto(tIdx, mode) {
        const mats = getMatrices(), x = calculateX(mats);
        const score = m => state.round <= 2 ? axSum(m, x) : calculateDet(m);
        let m = [...mats[tIdx]];
        if (mode === 'zero') {
            let best={idx:0,s:Infinity};
            for(let i=0;i<9;i++){let n=[...m];n[i]=0;let s=score(n);if(s<best.s)best={idx:i,s};}
            m[best.idx]=0;
        } else if (mode === 'swap_elements') {
            let best={a:0,b:1,s:Infinity};
            for(let a=0;a<9;a++)for(let b=a+1;b<9;b++){let n=[...m],tmp=n[a];n[a]=n[b];n[b]=tmp;let s=score(n);if(s<best.s)best={a,b,s};}
            let tmp=m[best.a];m[best.a]=m[best.b];m[best.b]=tmp;
        } else if (mode === 'swap_row') {
            let best={a:0,b:1,s:Infinity};
            for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){let n=[...m];for(let c=0;c<3;c++){let t=n[a*3+c];n[a*3+c]=n[b*3+c];n[b*3+c]=t;}let s=score(n);if(s<best.s)best={a,b,s};}
            for(let c=0;c<3;c++){let t=m[best.a*3+c];m[best.a*3+c]=m[best.b*3+c];m[best.b*3+c]=t;}
        } else if (mode === 'swap_col') {
            let best={a:0,b:1,s:Infinity};
            for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){let n=[...m];for(let r=0;r<3;r++){let t=n[r*3+a];n[r*3+a]=n[r*3+b];n[r*3+b]=t;}let s=score(n);if(s<best.s)best={a,b,s};}
            for(let r=0;r<3;r++){let t=m[r*3+best.a];m[r*3+best.a]=m[r*3+best.b];m[r*3+best.b]=t;}
        }
        for(let i=0;i<9;i++) document.getElementById(`t${tIdx}-c${i}`).value = m[i];
    }

    function exitFocus() {
        document.getElementById('priv-focus-overlay').style.display = 'none';
        state.privSelections=[]; state.privMode=null; state.privScope=null; state.privTarget=null;
    }

    function nextRound() {
        if(state.round < 5) { state.round++; beginTurn(); }
        else {
            const winner = getFinalWinner(getMatrices());
            alert(winner.winner!==-1 ? `최종 우승: T${winner.winner+1}` : "전원 탈락!");
            state.active = false;
        }
    }

    function getFinalWinner(mats) {
        const x = calculateX(mats);
        const survivors = mats.map((m,i)=>({i, d:calculateDet(m), ax:axSum(m,x)})).filter(p=>p.d!==0);
        if(survivors.length === 0) return {winner:-1};
        survivors.sort((a,b)=>b.ax-a.ax || Math.abs(b.d)-Math.abs(a.d));
        return {winner: survivors[0].i};
    }

    function addLog(type, msg) {
        const el = document.getElementById('log'), d = document.createElement('div');
        d.className = `log-${type}`; d.textContent = `> ${msg}`; el.prepend(d);
    }

    // ── MLP AI Engine ─────────────────────────────────────────────
    // 팀별 탐험 온도: 1=완전 그리디, 2~5=점진적 다양성
    const AI_TEMPS = [0, 0.0, 0.18, 0.38, 0.58, 0.80];

    async function loadMLPWeights() {
        try {
            const res = await fetch('strategy_weights.json');
            mlpWeights = await res.json();
            addLog('sys', 'AI 엔진(MLP) 로드 완료.');
        } catch(e) { /* fallback to heuristic */ }
    }

    function buildFeature(tIdx, mats, x, round) {
        const feat = new Array(30).fill(0);
        for(let i=0; i<9; i++) feat[i] = mats[tIdx][i];
        for(let i=0; i<3; i++) feat[9+i] = x[i];
        feat[12] = round;

        const scores = mats.map(mm => round <= 2 ? axSum(mm, x) : calculateDet(mm));
        const maxAbsS = Math.max(1e-8, ...scores.map(s => Math.abs(s)));
        for(let i=0; i<6; i++) feat[13+i] = scores[i] / maxAbsS;

        const dets = mats.map(mm => calculateDet(mm));
        const maxAbsD = Math.max(1e-8, ...dets.map(d => Math.abs(d)));
        for(let i=0; i<6; i++) feat[19+i] = dets[i] / maxAbsD;

        const myScore = scores[tIdx];
        feat[25] = scores.filter(s => s > myScore).length / 5;
        feat[26] = 1.0;
        return feat;
    }

    function mlpForward(feat, w1, b1, w2, b2) {
        const h = new Array(b1.length);
        for(let j=0; j<b1.length; j++) {
            let s = b1[j];
            for(let i=0; i<feat.length; i++) s += feat[i] * w1[i][j];
            h[j] = s > 0 ? s : 0;
        }
        const out = new Array(b2.length);
        for(let j=0; j<b2.length; j++) {
            let s = b2[j];
            for(let i=0; i<h.length; i++) s += h[i] * w2[i][j];
            out[j] = s;
        }
        return out;
    }

    function softmaxSample(logits, temp) {
        const t = Math.max(temp, 1e-6);
        const mx = logits.reduce((m, v) => v > -1e8 && v/t > m ? v/t : m, -Infinity);
        const exps = logits.map(l => l > -1e8 ? Math.exp(l/t - mx) : 0);
        const sum = exps.reduce((a,b) => a+b, 0);
        const probs = exps.map(e => e/sum);
        let r = Math.random(), cum = 0;
        for(let i=0; i<probs.length; i++) { cum += probs[i]; if(r < cum) return i; }
        return probs.length - 1;
    }

    function aiPickAction(tIdx, mats, x, round, usedIdx, temp) {
        let logits;
        if(mlpWeights) {
            const feat = buildFeature(tIdx, mats, x, round);
            logits = mlpForward(feat, mlpWeights.w1, mlpWeights.b1, mlpWeights.w2, mlpWeights.b2);
        } else {
            logits = new Array(18).fill(0);
            const m = mats[tIdx];
            for(let i=0; i<9; i++) {
                for(let di=0; di<2; di++) {
                    const d = di===0 ? 1 : -1, n=[...m]; n[i]+=d;
                    logits[i*2+di] = round<=2 ? axSum(n,x) : calculateDet(n);
                }
            }
        }
        for(const idx of usedIdx) { logits[idx*2]=-1e9; logits[idx*2+1]=-1e9; }
        const actionIdx = temp<=0
            ? logits.indexOf(Math.max(...logits))
            : softmaxSample(logits, temp);
        return { cellIdx: Math.floor(actionIdx/2), delta: actionIdx%2===0 ? 1 : -1 };
    }

    function clearAllInputs() {
        document.querySelectorAll('.matrix-grid input').forEach(inp => { inp.value=0; inp.disabled=false; inp.classList.remove('cell-used'); });
        state.used.clear(); updateHUD();
    }

    function toggleDiag() {
        const masks = document.querySelectorAll('.diag-mask');
        const currentlyMasked = masks[0].classList.contains('active');
        masks.forEach(m => m.classList.toggle('active', !currentlyMasked));
        document.getElementById('btn-reveal').innerHTML = !currentlyMasked ? '🔒 대각 숨김' : '🔓 대각 공개';
    }

    const container = document.getElementById('matrix-container');
    for(let t=0; t<6; t++) {
        const card = document.createElement('div'); card.className = `team-card ${t===0?'is-player':''}`; card.dataset.team = t;
        card.innerHTML = `<div class="team-card-header"><span class="team-name">TEAM ${t+1}</span></div><div class="matrix-grid"></div><div class="det-box" id="det-${t}"></div>`;
        const grid = card.querySelector('.matrix-grid');
        for(let i=0; i<9; i++) {
            const wrap = document.createElement('div'); wrap.className = 'cell-wrapper';
            const inp = document.createElement('input'); inp.type = 'number'; inp.id = `t${t}-c${i}`; inp.value = 0;
            inp.addEventListener('input', () => {
                if(t===0 && state.playerTurn && state.actions > 0 && !state.used.has(i)) {
                    state.actions--; state.used.add(i); inp.classList.add('cell-used'); inp.disabled = true; updateHUD();
                } else if(t===0 && !state.active) updateHUD();
            });
            inp.addEventListener('focus', function() { this.select(); });
            wrap.appendChild(inp);
            if(t>0 && DIAG.includes(i)) {
                const mask = document.createElement('div'); mask.className = 'diag-mask active'; mask.id = `mask-t${t}-c${i}`; mask.textContent = '?';
                wrap.appendChild(mask);
            }
            grid.appendChild(wrap);
        }
        container.appendChild(card);
    }
    updateHUD();
    loadMLPWeights();
</script>
