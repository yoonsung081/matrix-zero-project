<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Survival Battle</title>
    <script>
        (function() {
            const SUPPRESSED = ['message channel closed', 'listener indicated', 'asynchronous response'];
            window.onerror = function(msg) {
                const s = typeof msg === 'string' ? msg : (msg.message || String(msg));
                if (SUPPRESSED.some(k => s.toLowerCase().includes(k))) return true;
            };
            window.addEventListener('unhandledrejection', e => {
                const msg = e.reason ? (e.reason.message || String(e.reason)) : '';
                if (SUPPRESSED.some(k => msg.toLowerCase().includes(k))) { e.preventDefault(); e.stopImmediatePropagation(); }
            }, true);
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #08080a; color: #eee; font-size: 10px; }
        .app-container { display: grid; grid-template-columns: 160px 1fr 180px; grid-template-rows: 40px 1fr; height: 100vh; gap: 3px; padding: 3px; }
        header { grid-column: 1 / -1; background: #16161a; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border: 1px solid #333; }
        .nav-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #444; color: #888; text-decoration: none; font-weight: bold; font-size: 0.7rem; background: #222; }
        .nav-btn.active { border-color: #00ffcc; color: #00ffcc; background: #333; }
        .hud-item { padding: 2px 6px; border-radius: 10px; background: #222; border: 1px solid #444; font-weight: bold; font-size: 0.65rem; }
        .sidebar { background: #16161a; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #333; }
        .main-content { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px; height: 100%; min-height: 0; }
        .analysis-bar { background: #16161a; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #333; }
        .team-card { background: #1c1c21; border: 1px solid #333; border-radius: 4px; padding: 3px; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-height: 0; }
        .team-card.is-player { border-color: #00ffcc; background: #111a19; }
        .team-card.targetable { border-color: #ffd700; cursor: pointer; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .team-name { font-size: 0.65rem; font-weight: bold; color: #555; }
        .is-player .team-name { color: #00ffcc; }
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; flex-grow: 1; }
        .matrix-grid input { width: 100%; height: 100%; text-align: center; background: #000; color: #fff; border: 1px solid #333; border-radius: 1px; font-size: 0.85rem; font-weight: bold; }
        .matrix-grid input.cell-used { border-color: #ff8c00 !important; background: rgba(255,140,0,0.15) !important; color: #ff8c00; }
        .det-box { margin-top: 2px; padding: 2px 4px; background: rgba(0,0,0,0.4); border-radius: 2px; display: flex; justify-content: space-between; font-size: 0.55rem; font-family: monospace; }
        .btn { width: 100%; padding: 5px; border-radius: 3px; border: none; cursor: pointer; font-weight: bold; font-size: 0.7rem; background:#333; color:#fff; }
        .log-area { flex-grow: 1; background: #000; padding: 4px; font-size: 0.58rem; overflow-y: auto; border: 1px solid #222; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
        .modal { background: #1a1a1d; border: 2px solid #007bff; padding: 12px; border-radius: 8px; width: 280px; }
        .priv-btn { margin-bottom: 4px; padding: 8px; font-size: 0.7rem; background: #222; color: #fff; border: 1px solid #444; width: 100%; cursor: pointer; }
        .diag-mask { position: absolute; inset: 0; background: #111; border: 1px solid #222; display: flex; align-items: center; justify-content: center; color: #444; font-size: 1.1rem; pointer-events: none; z-index: 5; }
        .diag-mask.active { display: flex; }
    </style>
</head>
<body>
<div class="overlay" id="privilege-ui">
    <div class="modal">
        <h2 style="color:#ffd700; margin-bottom:12px; font-size:0.9rem; text-align:center;">🏆 승자 특권 선택</h2>
        <button class="btn priv-btn" onclick="startManualPriv('SwapRows')">🔄 행 교환</button>
        <button class="btn priv-btn" onclick="startManualPriv('SwapColumns')">🔄 열 교환</button>
        <button class="btn priv-btn" onclick="startManualPriv('ZeroCell')">💀 원소 무력화</button>
        <button class="btn priv-btn" onclick="startManualPriv('SwapCells')">↔️ 위치 교환</button>
    </div>
</div>
<div class="app-container">
    <header>
        <h1>MATRIX SURVIVAL</h1>
        <a href="index.html" class="nav-btn active">⚔️ 배틀 모드</a>
        <a href="advice.html" class="nav-btn">📊 조언 모드</a>
        <div id="hud-round" class="hud-item" style="margin-left:auto;">R1</div>
        <div id="hud-actions" class="hud-item">남은: 1</div>
    </header>
    <div class="sidebar">
        <button class="btn" style="background:#28a745;" onclick="startBattle()">🎮 새 게임 시작</button>
        <button class="btn" id="btn-confirm" onclick="confirmMove()" disabled>✅ 내 수 확정</button>
        <button class="btn" onclick="clearAllInputs()">🧹 초기화</button>
        <button class="btn" id="btn-reveal" onclick="toggleDiag()">🔓 대각 공개</button>
        <div class="log-area" id="log"></div>
    </div>
    <div class="main-content" id="matrix-container"></div>
    <div class="analysis-bar" id="ranking-content"></div>
</div>
<script>
    const state = { active: false, playerTurn: false, round: 1, actions: 1, used: new Set(), privMode: null, privTarget: null, privSelections: [] };
    const DIAG = [0, 4, 8];

    function calculateDet(m) { return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]); }
    function calculateX(mats) { let x=[0,0,0]; for(let i=0; i<3; i++) x[i]=Math.floor(mats.reduce((s,m)=>s+m[i*4],0)/6); return x; }
    function axSum(m, x) { return m[0]*x[0]+m[1]*x[1]+m[2]*x[2]+m[3]*x[0]+m[4]*x[1]+m[5]*x[2]+m[6]*x[0]+m[7]*x[1]+m[8]*x[2]; }

    function getMatrices() {
        let all = [];
        for(let t=0; t<6; t++) {
            let m = []; for(let i=0; i<9; i++) m.push(parseInt(document.getElementById(`t${t}-c${i}`).value) || 0);
            all.push(m);
        }
        return all;
    }

    function updateHUD() {
        const mats = getMatrices(), x = calculateX(mats);
        document.getElementById('hud-round').textContent = `R${state.round}`;
        document.getElementById('hud-actions').textContent = `남은: ${state.actions}`;
        document.getElementById('hud-x').textContent = `X=[${x.join(',')}]`;
        mats.forEach((m, t) => {
            const d = calculateDet(m), ax = axSum(m, x);
            document.getElementById(`det-${t}`).innerHTML = `<span>det: <b class="${d===0?'zero':''}">${d}</b></span><span>Ax: <b class="ax-val">${ax.toFixed(1)}</b></span>`;
        });
        const ranking = mats.map((m,i)=>({i, s: state.round<=2?axSum(m,x):calculateDet(m)})).sort((a,b)=>b.s-a.s);
        let h = `<div style="font-size:0.6rem; color:#444;">RANKING</div>`;
        ranking.forEach((r, rank) => { h += `<div style="display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #222; ${r.i===0?'color:#0cf; font-weight:bold;':''}"><span>${rank+1}위 T${r.i+1}</span><span>${r.s.toFixed(1)}</span></div>`; });
        document.getElementById('ranking-content').innerHTML = h;

        if(state.actions === 0 && state.playerTurn && !state.privMode) {
            for(let i=0; i<9; i++) document.getElementById(`t0-c${i}`).disabled = true;
        }
    }

    function startBattle() {
        state.active = true; state.round = 1; document.getElementById('btn-confirm').disabled = false;
        document.getElementById('log').innerHTML = '';
        for(let t=0; t<6; t++) {
            for(let i=0; i<9; i++) {
                const inp = document.getElementById(`t${t}-c${i}`);
                inp.value = 0; inp.disabled = (t > 0); inp.classList.remove('cell-used');
            }
        }
        beginTurn();
    }

    function beginTurn() {
        state.playerTurn = true; state.actions = state.round; state.used.clear();
        for(let i=0; i<9; i++) {
            const inp = document.getElementById(`t0-c${i}`);
            inp.disabled = false; inp.classList.remove('cell-used');
        }
        updateHUD();
    }

    async function confirmMove() {
        if(state.actions > 0) return alert('행동을 다 쓰세요.');
        state.playerTurn = false;
        document.getElementById('log').innerHTML = '';
        for(let t=1; t<=5; t++) {
            await new Promise(r=>setTimeout(r,300));
            let all = getMatrices(), myM = [...all[t]], usedIdx = new Set();
            for(let a=0; a<state.round; a++) {
                let best = {idx:0, d:1, s:-1e9};
                for(let i=0; i<9; i++) {
                    if(usedIdx.has(i)) continue;
                    for(let d of [-1, 1]) {
                        let n = [...myM]; n[i]+=d;
                        let s = state.round <= 2 ? (n[0]+n[4]+n[8]) : calculateDet(n);
                        if(s > best.s) best = {idx:i, d, s:score=s};
                    }
                }
                if(best.idx!==-1){ myM[best.idx]+=best.d; usedIdx.add(best.idx); }
            }
            for(let i=0; i<9; i++) document.getElementById(`t${t}-c${i}`).value = myM[i];
            syncMatrices();
        }
        check();
    }

    function syncMatrices() { updateHUD(); }
    
    function check() {
        const mats=getMatrices(), x=calculateX(mats), r=state.round;
        const sc=mats.map(m=>r<=2?axSum(m,x):calculateDet(m)).map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
        let win=-1;
        if(sc[0].s>sc[1].s) win=sc[0].i;
        else { const p2=sc.filter(v=>v.s<sc[0].s); if(p2.length>0&&(p2.length===1||p2[0].s>p2[1].s)) win=p2[0].i; }
        
        if(win!==-1){
            if(win===0) document.getElementById('privilege-ui').style.display='flex';
            else { autoPriv(win); setTimeout(nxtR, 1200); }
        } else { nxtR(); }
    }

    function startPrivilegeFlow(m) {
        state.privMode=m; state.privSelections=[]; document.getElementById('privilege-ui').style.display='none';
        document.querySelectorAll('.team-card').forEach(c=>c.classList.add('targetable'));
    }

    function applyManualPriv(tIdx, selections) {
        const mats=getMatrices(); let m=[...mats[tIdx]];
        if(state.privMode==='ZeroCell') m[selections[0]]=0;
        else if(state.privMode==='SwapCells'){ let t=m[selections[0]]; m[selections[0]]=m[selections[1]]; m[selections[1]]=t; }
        // etc
        for(let i=0;i<9;i++) document.getElementById(`t${tIdx}-c${i}`).value=m[i];
        state.privMode=null; document.querySelectorAll('.targetable').forEach(c=>c.classList.remove('targetable'));
        syncMatrices(); setTimeout(nxtR, 800);
    }

    function autoPriv(win){
        let target=0, ms=getMatrices();
        let m=[...ms[target]]; m[0]=0;
        for(let i=0;i<9;i++) document.getElementById(`t${target}-c${i}`).value=m[i];
        syncMatrices();
    }

    function nxtR(){
        if(state.round<5){ state.round++; beginTurn(); }
        else { alert("게임 종료"); state.active=false; }
    }

    function clearAllInputs() { document.querySelectorAll('input').forEach(i=>{i.value=0;i.disabled=false;i.classList.remove('cell-used');}); state.used.clear(); updateHUD(); }
    function toggleDiag() { const ms=document.querySelectorAll('.diag-mask'); const act=ms[0].classList.contains('active'); ms.forEach(m=>m.classList.toggle('active', !act)); document.getElementById('btn-reveal').textContent=act?'🔓 대각 공개':'🔒 대각 숨김'; }

    const cont = document.getElementById('matrix-container');
    for(let t=0;t<6;t++){
        const c=document.createElement('div'); c.className=`team-card ${t===0?'is-player':''}`;
        c.innerHTML=`<div class="team-card-header"><span class="team-name">TEAM ${t+1}</span></div><div class="matrix-grid"></div><div class="det-box" id="det-${t}"></div>`;
        const g=c.querySelector('.matrix-grid');
        for(let i=0;i<9;i++){
            const w=document.createElement('div'); w.className='cell-wrapper';
            const n=document.createElement('input'); n.type='number'; n.id=`t${t}-c${i}`; n.value=0;
            n.oninput=updateHUD; w.appendChild(n);
            if(t>0 && DIAG.includes(i)){ const m=document.createElement('div'); m.className='diag-mask active'; m.textContent='?'; w.appendChild(m); }
            g.appendChild(w);
        }
        cont.appendChild(c);
    }
    updateHUD();
</script>
</body>
</html>
