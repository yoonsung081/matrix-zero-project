<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Strategy: Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #09090b; color: #eee; font-size: 10px; }
        .app-container { display: grid; grid-template-columns: 180px 1fr 180px; grid-template-rows: 40px 1fr; height: 100vh; gap: 4px; padding: 4px; }
        header { grid-column: 1 / -1; background: #16161a; display: flex; align-items: center; padding: 0 10px; gap: 10px; border: 1px solid #333; border-radius: 4px; }
        .sidebar { background: #16161a; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 5px; border: 1px solid #333; overflow-y: auto; }
        .main-content { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4px; height: 100%; min-width: 0; }
        .team-card { background: #1c1c21; border: 1px solid #333; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; }
        .team-card.is-focus { border-color: #0cf; background: #111a19; }
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; flex-grow: 1; }
        .matrix-grid input { width: 100%; height: 100%; text-align: center; background: #000; color: #fff; border: 1px solid #222; font-size: 0.85rem; font-weight: bold; }
        .btn { width: 100%; padding: 6px; border-radius: 3px; border: none; cursor: pointer; font-weight: bold; font-size: 0.65rem; background:#333; color:#fff; }
        .rec-item { background: #1a1a1d; border-left: 3px solid #0cf; padding: 5px; margin-bottom: 5px; font-size: 0.65rem; cursor: pointer; }
        select, input { width: 100%; background: #222; color: #eee; border: 1px solid #444; padding: 3px; font-size: 0.65rem; border-radius: 3px; }
        .diag-mask { position: absolute; inset: 0; background: #111; display: flex; align-items: center; justify-content: center; color: #ff8c00; font-weight:bold; pointer-events: none; }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <h1 style="color:#00ffcc; font-size:0.8rem;">STRATEGY ASSISTANT</h1>
        <div style="display:flex; align-items:center; gap:5px; margin-left:auto;">
            <span style="font-size:0.6rem;">Manual X:</span>
            <input type="number" id="mx0" style="width:30px" oninput="updateHUD()">
            <input type="number" id="mx1" style="width:30px" oninput="updateHUD()">
            <input type="number" id="mx2" style="width:30px" oninput="updateHUD()">
        </div>
    </header>
    <div class="sidebar">
        <label style="font-size:0.6rem;">활성 팀 수 (1-6)</label>
        <input type="number" id="team-count" value="6" min="1" max="6" onchange="initTeams()">
        <label style="font-size:0.6rem; margin-top:5px;">라운드 (N개)</label>
        <select id="round-select" onchange="updateHUD()">
            <option value="1">1개 추천</option><option value="2">2개 세트</option>
            <option value="3">3개 세트</option><option value="4">4개 세트</option><option value="5">5개 세트</option>
        </select>
        <label style="font-size:0.6rem; margin-top:5px;">조언 대상</label>
        <select id="focus-team" onchange="setFocus()"></select>
        <button class="btn" onclick="clearAll()">🧹 초기화</button>
        <div id="recommendations" style="flex-grow:1; overflow-y:auto; margin-top:5px;"></div>
        <a href="index.html" class="btn" style="background:#222; color:#ff6b6b; text-decoration:none; text-align:center;">⚔️ 배틀 모드</a>
    </div>
    <div class="main-content" id="matrix-container"></div>
</div>
<script>
    let focusIdx = 0, weights = null, activeTeams = 6;
    function calculateDet(m) { return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]); }
    function axSum(m, x) { return m[0]*x[0]+m[1]*x[1]+m[2]*x[2]+m[3]*x[0]+m[4]*x[1]+m[5]*x[2]+m[6]*x[0]+m[7]*x[1]+m[8]*x[2]; }
    
    function getX() {
        return [parseInt(document.getElementById('mx0').value)||0, parseInt(document.getElementById('mx1').value)||0, parseInt(document.getElementById('mx2').value)||0];
    }

    function initTeams() {
        activeTeams = parseInt(document.getElementById('team-count').value);
        const cont = document.getElementById('matrix-container'); cont.innerHTML = '';
        const fs = document.getElementById('focus-team'); fs.innerHTML = '';
        for(let t=0; t<activeTeams; t++){
            const c = document.createElement('div'); c.className=`team-card ${t===focusIdx?'is-focus':''}`;
            c.innerHTML=`<div class="team-name">TEAM ${t+1}</div><div class="matrix-grid" id="grid-${t}"></div>`;
            const g = c.querySelector('.matrix-grid');
            for(let i=0;i<9;i++){
                const w = document.createElement('div'); w.style.position='relative';
                const n = document.createElement('input'); n.id=`t${t}-c${i}`; n.value=0; n.oninput=updateHUD;
                w.appendChild(n);
                if(t>0 && [0,4,8].includes(i)) { const m=document.createElement('div'); m.className='diag-mask'; m.textContent='?'; w.appendChild(m); }
                g.appendChild(w);
            }
            cont.appendChild(c);
            fs.innerHTML += `<option value="${t}">Team ${t+1}</option>`;
        }
        updateHUD();
    }

    function updateHUD() {
        const mats = Array.from({length:activeTeams}, (_,t)=>Array.from({length:9}, (__,i)=>parseInt(document.getElementById(`t${t}-c${i}`).value)||0));
        let x = getX();
        if(x.every(v=>v===0)) {
            x = [0,0,0]; for(let i=0; i<3; i++) x[i] = Math.floor(mats.reduce((s, m) => s + m[i*4], 0) / activeTeams);
        }
        
        let n = parseInt(document.getElementById('round-select').value);
        let myM = mats[focusIdx], recs = [];
        for(let i=0; i<9; i++) {
            for(let d of [-1, 1]) {
                let m = [...myM]; m[i]+=d;
                recs.push({i, d, s: n<=2?axSum(m,x):calculateDet(m)});
            }
        }
        recs.sort((a,b)=>b.s-a.s);
        let rh = '';
        recs.slice(0, 6).forEach(rec => {
            rh += `<div class="rec-item"><b>[${Math.floor(rec.i/3)+1}, ${rec.i%3+1}]</b>에 ${rec.d>0?'+1':'-1'} 적용<br>예상: ${rec.s.toFixed(1)}</div>`;
        });
        document.getElementById('recommendations').innerHTML = rh;
    }

    function setFocus() { focusIdx = parseInt(document.getElementById('focus-team').value); initTeams(); }
    function clearAll() { document.querySelectorAll('input').forEach(i=>i.value=0); updateHUD(); }
    initTeams();
</script>
</body>
</html>
