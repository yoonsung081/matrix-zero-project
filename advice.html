<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Strategy Assistant</title>
    <script>
        window.addEventListener('unhandledrejection', e => { 
            if (e.reason && e.reason.message && (e.reason.message.includes('message channel closed') || e.reason.message.includes('listener indicated'))) {
                e.preventDefault(); e.stopImmediatePropagation();
            }
        }, true);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f11; color: #eee; font-size: 13px;
        }
        .app-container {
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: 40px 1fr;
            height: 100vh; gap: 4px; padding: 4px;
        }
        header {
            grid-column: 1 / -1; background: #1a1a1d; border-radius: 6px;
            display: flex; align-items: center; padding: 0 15px; gap: 15px;
            border: 1px solid #333;
        }
        h1 { font-size: 1rem; color: #00ffcc; }
        .sidebar { background: #1a1a1d; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; overflow: hidden; }
        .main-content { background: #1a1a1d; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #333; padding: 10px; }
        
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 450px; }
        .matrix-grid input {
            width: 100%; aspect-ratio: 1; text-align: center; background: #000; color: #fff;
            border: 2px solid #444; border-radius: 8px; font-size: 1.8rem; font-weight: bold;
        }

        .btn { padding: 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-danger { background: #dc3545; color: white; width: 100%; max-width: 300px; margin-top: 15px; }
        .btn-page { background: #333; color: #aaa; margin-left: auto; border: 1px solid #444; }

        .rec-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .rec-card { background: #222226; border-left: 3px solid #00ffcc; padding: 8px; border-radius: 4px; margin-bottom: 6px; font-size: 0.75rem; }
        .rec-pos { color: #00ffcc; font-weight: bold; }
        
        .det-display { font-size: 1.2rem; font-family: monospace; margin-left: 20px; }
        .det-val { font-weight: bold; color: #fff; }
        .det-val.zero { color: #ff4444; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>ASSISTANT</h1>
        <div class="det-display">det(A) = <span id="det-val" class="det-val">0</span></div>
        <button class="btn btn-page" onclick="location.href='index.html'">⚔️ 배틀 모드로 이동</button>
    </header>

    <div class="main-content">
        <div class="matrix-grid" id="matrix-inputs"></div>
        <button class="btn btn-danger" onclick="resetMatrix()">🧹 초기화</button>
    </div>

    <div class="sidebar">
        <div style="font-size:0.6rem; color:#555; text-transform:uppercase;">추천 전략</div>
        <div id="recommendations" class="rec-list"></div>
    </div>
</div>

<script>
    function calculateDet(m) {
        return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]);
    }
    function getM() { return Array.from({length: 9}, (_, i) => parseInt(document.getElementById(`v${i}`).value) || 0); }
    function resetMatrix() { for(let i=0; i<9; i++) document.getElementById(`v${i}`).value = 0; analyze(); }

    function analyze() {
        const m = getM(), det = calculateDet(m);
        const detEl = document.getElementById('det-val');
        detEl.textContent = det;
        detEl.className = 'det-val' + (det === 0 ? ' zero' : '');

        let recs = [];
        for(let i=0; i<9; i++) {
            for(let d of [-1, 1]) {
                let next = [...m]; next[i] += d;
                let nextDet = calculateDet(next);
                recs.push({ i, d, det: nextDet, diff: Math.abs(nextDet) - Math.abs(det) });
            }
        }
        recs.sort((a, b) => b.diff - a.diff);

        let h = '';
        recs.slice(0, 8).forEach(r => {
            const row = Math.floor(r.i / 3) + 1, col = (r.i % 3) + 1;
            h += `<div class="rec-card">
                <span class="rec-pos">[${row}, ${col}]</span> 에 <b>${r.d>0?'+1':'-1'}</b> 적용<br>
                <div style="color:#888; margin-top:2px;">det: ${r.det} (${r.diff>0?'+':''}${r.diff})</div>
            </div>`;
        });
        document.getElementById('recommendations').innerHTML = h;
    }

    const grid = document.getElementById('matrix-inputs');
    for(let i=0; i<9; i++) {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.id = `v${i}`; inp.value = 0;
        inp.addEventListener('input', analyze);
        inp.addEventListener('focus', function() { this.select(); });
        grid.appendChild(inp);
    }
    analyze();
</script>
</body>
</html>
