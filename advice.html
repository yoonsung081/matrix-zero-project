<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Strategy Assistant</title>
    <script>
        // 익스텐션 메시지 채널 오류 억제
        window.addEventListener('unhandledrejection', e => { 
            if (e.reason && e.reason.message && (e.reason.message.includes('message channel closed') || e.reason.message.includes('listener indicated'))) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, true);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f11; color: #eee; font-size: 14px;
        }
        .app-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 50px 1fr;
            height: 100vh; gap: 6px; padding: 6px;
        }
        header {
            grid-column: 1 / -1; background: #1a1a1d; border-radius: 8px;
            display: flex; align-items: center; padding: 0 20px; gap: 20px;
            border: 1px solid #333;
        }
        h1 { font-size: 1.2rem; color: #00ffcc; }
        .sidebar { background: #1a1a1d; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; overflow-y: auto; }
        .main-content { background: #1a1a1d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #333; }
        
        .matrix-grid { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin-bottom: 20px; }
        .matrix-grid input {
            width: 100px; height: 100px; text-align: center; background: #111; color: #fff;
            border: 2px solid #444; border-radius: 8px; font-size: 2.2rem; font-weight: bold;
            transition: border-color 0.2s, background 0.2s;
        }
        .matrix-grid input:focus { outline: none; border-color: #007bff; background: #1a2a3a; }

        .btn { padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn-danger { background: #dc3545; color: white; width: 320px; }
        .btn-page { background: #444; color: #ccc; margin-left: auto; }
        .btn:hover { filter: brightness(1.2); }

        .sec-title { font-size: 0.7rem; color: #555; text-transform: uppercase; border-bottom: 1px solid #333; margin-bottom: 10px; padding-bottom: 4px; letter-spacing: 1px; }
        
        .rec-card { background: #222226; border-left: 4px solid #00ffcc; padding: 12px; border-radius: 4px; margin-bottom: 10px; }
        .rec-pos { color: #00ffcc; font-weight: bold; font-size: 0.9rem; }
        .rec-delta { font-weight: bold; }
        .delta-plus { color: #28a745; }
        .delta-minus { color: #dc3545; }
        .rec-impact { font-size: 0.8rem; color: #aaa; margin-top: 4px; }

        .det-display { font-size: 1.5rem; margin-bottom: 20px; font-family: monospace; }
        .det-val { font-weight: bold; }
        .det-val.zero { color: #ff4444; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>STRATEGY ASSISTANT</h1>
        <div class="det-display">det(A) = <span id="det-val" class="det-val">0</span></div>
        <button class="btn btn-page" onclick="location.href='index.html'">⚔️ 대전 모드(Survival)로 이동</button>
    </header>

    <div class="main-content">
        <div class="matrix-grid" id="matrix-inputs">
            <!-- JS generates inputs -->
        </div>
        <button class="btn btn-danger" onclick="resetMatrix()">🧹 행렬 초기화</button>
    </div>

    <div class="sidebar">
        <div class="sec-title">실시간 추천 전략</div>
        <div id="recommendations">
            <div style="color:#555; text-align:center; padding-top:20px;">행렬 값을 입력하세요</div>
        </div>
    </div>
</div>

<script>
    function calculateDet(m) {
        return m[0] * (m[4] * m[8] - m[5] * m[7]) -
               m[1] * (m[3] * m[8] - m[5] * m[6]) +
               m[2] * (m[3] * m[7] - m[4] * m[6]);
    }

    function getM() {
        return Array.from({length: 9}, (_, i) => parseInt(document.getElementById(`v${i}`).value) || 0);
    }

    function resetMatrix() {
        for(let i=0; i<9; i++) {
            const inp = document.getElementById(`v${i}`);
            inp.value = 0;
        }
        analyze();
    }

    function analyze() {
        const m = getM();
        const det = calculateDet(m);
        const detEl = document.getElementById('det-val');
        detEl.textContent = det;
        detEl.className = 'det-val' + (det === 0 ? ' zero' : '');

        let recs = [];
        for(let i=0; i<9; i++) {
            for(let d of [-1, 1]) {
                let next = [...m];
                next[i] += d;
                let nextDet = calculateDet(next);
                // 점수 기준: 절댓값 det가 커지는 방향
                recs.push({ i, d, det: nextDet, diff: Math.abs(nextDet) - Math.abs(det) });
            }
        }

        recs.sort((a, b) => b.diff - a.diff);

        let h = '';
        recs.slice(0, 5).forEach(r => {
            const row = Math.floor(r.i / 3) + 1;
            const col = (r.i % 3) + 1;
            h += `
                <div class="rec-card">
                    <div class="rec-pos">[${row}행 ${col}열] <span class="rec-delta ${r.d>0?'delta-plus':'delta-minus'}">${r.d>0?'+1':'-1'}</span></div>
                    <div class="rec-impact">결과 행렬식: <b>${r.det}</b> (변화: ${r.diff>0?'+':''}${r.diff})</div>
                </div>
            `;
        });
        document.getElementById('recommendations').innerHTML = h || '<div style="color:#555; text-align:center;">계산 불가</div>';
    }

    const grid = document.getElementById('matrix-inputs');
    for(let i=0; i<9; i++) {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.id = `v${i}`;
        inp.value = 0;
        inp.addEventListener('input', analyze);
        inp.addEventListener('focus', function() { this.select(); });
        grid.appendChild(inp);
    }

    analyze();
</script>
</body>
</html>
